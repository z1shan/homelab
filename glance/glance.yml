pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 12h
            timezones:
              - timezone: Asia/Kolkata
                label: Pune
              - timezone: Asia/Kuala_Lumpur
                label: Kuala Lumpur
          - type: dns-stats
            service: pihole-v6
            url: http://192.168.10.2:8081
            password: xxxxx
          - type: custom-api
            title: Immich stats
            cache: 1d
            url: http://192.168.10.2:2283/api/server/statistics
            headers:
              x-api-key: xxxx
              Accept: application/json
            template: |
              <div class="flex justify-between text-center">
                <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "photos" | formatNumber }}</div>
                    <div class="size-h6">PHOTOS</div>
                </div>
                <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "videos" | formatNumber }}</div>
                    <div class="size-h6">VIDEOS</div>
                </div>
                <div>
                    <div class="color-highlight size-h3">{{ div (.JSON.Int "usage" | toFloat) 1073741824 | toInt | formatNumber }}GB</div>
                    <div class="size-h6">USAGE</div>
                </div>
              </div>
          - type: server-stats
            servers:
              - type: local
                name: zishan-main
                mountpoints:
                  "/mnt/immichssf":
                    name: Immich Storage
          - type: repository
            repository: z1shan/Microsoft-Sentinel
            pull-requests-limit: 5
            issues-limit: 3
            commits-limit: 3
            show-thumbnails: true
      - size: full
        widgets:
          - type: monitor
            title: Service Status
            sites:
              - title: Glance
                url: http://192.168.10.2:8099
                icon: si:google
              - title: Immich
                url: http://192.168.10.2:2283
                icon: si:immich
              - title: Nginx Proxy Manager
                url: http://192.168.10.2:81
                icon: si:nginxproxymanager
              - title: Pi-hole
                url: http://192.168.10.2:8081/admin
                icon: si:pihole
              - title: Beszel
                url: http://192.168.10.2:8090
                icon: si:statuspage
                widgets:
              - title: Paperlessngx
                url: http://192.168.10.2:8001
                icon: si:paperlessngx
                widgets:
          - type: docker-containers
            containers:
            container_name_1:
            name: Beszel
            description: Monitoring
            url: http://192.168.10.2:8090
            icon: si:Beszel
            hide: false
          - type: videos
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCIxQ54On7bLJKcmgnyWOejQ # NetBird
              - UCjSEJkpGbcZhvo0lr-44X_w # TechHut
              - UCgdTVe88YVSrOZ9qKumhULQ # Hardware Haven
              - UCOk-gHyjcWZNj3Br4oxwh0A # Techno Tim
              - UCzgA9CBrIXPtkB2yNTTiy1w # Level 2 Jeff
          - type: rss
            title: 🚨 Security News
            style: vertical-list
            limit: 15
            collapse-after: 10
            cache: 30m
            feeds:
            - url: https://feeds.feedburner.com/TheHackersNews
              title: The Hacker News
              limit: 4
            - url: https://www.bleepingcomputer.com/feed/
              title: BleepingComputer
              limit: 5
            - url: https://krebsonsecurity.com/feed/
              title: KrebsOnSecurity
              limit: 3
            - url: https://isc.sans.edu/rssfeed.xml
              title: SANS ISC
              limit: 3
          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
          - type: bookmarks
            groups:
              - title: Work
                links:
                  - title: Outlook
                    url: https://outlook.cloud.microsoft/
                    icon: si:outlook
                  - title: Azure Portal
                    url: https://portal.azure.com/
                    icon: si:cloud
                  - title: ECC - FreshService
                    url: https://ec-council.freshservice.com/a/dashboard/default
                    icon: si:itsm
                  - title: Office
                    url: https://office.com
                    icon: si:office
              - title: AI
                links:
                  - title: Claude
                    url: https://claude.com
                    icon: si:claude
                  - title: ChatGPT
                    url: https://chat.com
                    icon: si:chatgpt
          - type: to-do
